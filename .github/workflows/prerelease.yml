name: Prerelease

on:
  pull_request:
    types: [closed]
    branches: ["next"]

permissions:
  contents: write
  id-token: write

jobs:
  prerelease:
    name: Prerelease Amicons
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get version
        id: version
        run: echo "version=$(jq -r '.version' amicons/package.json)" >> $GITHUB_OUTPUT
      - name: Set prerelease metadata
        id: meta
        run: |
          echo "tag=v${{ steps.version.outputs.version }}-next.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "label=v${{ steps.version.outputs.version }}-next.${{ github.run_number }}" >> $GITHUB_OUTPUT
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
          cache-dependency-path: amicons/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        working-directory: amicons
        run: pnpm install --frozen-lockfile
      - name: Production build
        working-directory: amicons
        run: pnpm prod
      - name: Package icons
        working-directory: amicons
        run: zip -r ../amicons-${{ steps.meta.outputs.label }}-icons.zip icons -i "*.svg"

      - name: Write release notes
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: echo "$BODY" > release-notes.md
      - name: Create GitHub prerelease
        run: |
          gh release create ${{ steps.meta.outputs.tag }} \
            --title "${{ steps.meta.outputs.label }}" \
            --prerelease \
            --notes-file release-notes.md \
            "amicons-${{ steps.meta.outputs.label }}-icons.zip#Amicons icons ${{ steps.meta.outputs.label }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm (next)
        working-directory: amicons
        run: pnpm publish --no-git-checks --access public --provenance --tag next
