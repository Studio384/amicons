name: Release

on:
  push:
    branches: ["main", "next"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  release:
    name: Release Amicons
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get PR metadata
        id: pr
        run: |
          PR_NUMBER=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$PR_NUMBER" ]; then
            TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title')
            BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          else
            TITLE="${{ github.event.head_commit.message }}"
            BODY="Automated release for commit ${{ github.sha }}."
          fi

          {
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Get version
        id: version
        run: echo "version=$(jq -r '.version' amicons/package.json)" >> $GITHUB_OUTPUT
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
          cache-dependency-path: amicons/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: amicons
        run: pnpm install --frozen-lockfile
      - name: Production build
        working-directory: amicons
        run: pnpm prod
      - name: Package icons
        working-directory: amicons
        run: zip -r ../amicons-${{ steps.version.outputs.version }}-icons.zip icons -i "*.svg"

      - name: Write release notes
        env:
          BODY: ${{ steps.pr.outputs.body }}
        run: echo "$BODY" > release-notes.md
      - name: Create GitHub release
        run: |
          gh release create v${{ steps.version.outputs.version }} \
            --title "${{ steps.pr.outputs.title }}" \
            --notes-file release-notes.md \
            "amicons-${{ steps.version.outputs.version }}-icons.zip#Amicons icons v${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm
        working-directory: amicons
        run: pnpm publish --no-git-checks --access public --provenance

  prerelease:
    name: Prerelease Amicons
    if: github.ref_name == 'next'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get PR metadata
        id: pr
        run: |
          PR_NUMBER=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$PR_NUMBER" ]; then
            TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title')
            BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          else
            TITLE="${{ github.event.head_commit.message }}"
            BODY="Automated prerelease for commit ${{ github.sha }}."
          fi

          {
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Get version
        id: version
        run: echo "version=$(jq -r '.version' amicons/package.json)" >> $GITHUB_OUTPUT
      - name: Set prerelease metadata
        id: meta
        run: |
          echo "tag=v${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "label=v${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
          cache-dependency-path: amicons/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        working-directory: amicons
        run: pnpm install --frozen-lockfile
      - name: Production build
        working-directory: amicons
        run: pnpm prod
      - name: Package icons
        working-directory: amicons
        run: zip -r ../amicons-${{ steps.meta.outputs.label }}-icons.zip icons -i "*.svg"

      - name: Write release notes
        env:
          BODY: ${{ steps.pr.outputs.body }}
        run: echo "$BODY" > release-notes.md
      - name: Create GitHub prerelease
        run: |
          gh release create ${{ steps.meta.outputs.tag }} \
            --title "${{ steps.pr.outputs.title }}" \
            --prerelease \
            --notes-file release-notes.md \
            "amicons-${{ steps.meta.outputs.label }}-icons.zip#Amicons icons ${{ steps.meta.outputs.label }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm (next)
        working-directory: amicons
        run: pnpm publish --no-git-checks --access public --provenance --tag next
