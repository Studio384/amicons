name: Release

on:
  pull_request:
    types: [closed]
    branches: ["main", "next"]

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Amicons package
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get version
        id: version
        run: echo "version=$(jq -r '.version' amicons/package.json)" >> $GITHUB_OUTPUT
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
          cache-dependency-path: amicons/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: amicons
        run: pnpm install --frozen-lockfile
      - name: Production build
        working-directory: amicons
        run: pnpm prod
      - name: Pack for npm
        working-directory: amicons
        run: pnpm pack
      - name: Package icons
        working-directory: amicons/icons
        run: zip -r ../../amicons-${{ steps.version.outputs.version }}-icons.zip . -i "*.svg"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            amicons/dist
            amicons/studio384-amicons-*.tgz
            amicons-${{ steps.version.outputs.version }}-icons.zip

  docs_check:
    name: Docs linting and formatting
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting
        run: pnpm format
      - name: Lint
        run: pnpm lint

  release:
    name: Release Amicons stable
    needs: [build, docs_check]
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
      - name: Write release notes
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > release-notes.md
      - name: Create GitHub release
        run: |
          gh release create v${{ needs.build.outputs.version }} \
            --repo ${{ github.repository }} \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "${{ github.event.pull_request.title }}" \
            --notes-file release-notes.md \
            "amicons-${{ needs.build.outputs.version }}-icons.zip#Amicons icons v${{ needs.build.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm
        run: npm publish ./amicons/studio384-amicons-${{ needs.build.outputs.version }}.tgz --access public --provenance

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: [release, docs_check]
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  prerelease:
    name: Prerelease Amicons preview
    needs: build
    if: github.event.pull_request.base.ref == 'next' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
      - name: Write release notes
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" > release-notes.md
      - name: Create GitHub prerelease
        run: |
          gh release create v${{ needs.build.outputs.version }} \
            --repo ${{ github.repository }} \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "${{ github.event.pull_request.title }}" \
            --prerelease \
            --notes-file release-notes.md \
            "amicons-${{ needs.build.outputs.version }}-icons.zip#Amicons icons v${{ needs.build.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm (next)
        run: npm publish ./amicons/studio384-amicons-${{ needs.build.outputs.version }}.tgz --access public --provenance --tag next
